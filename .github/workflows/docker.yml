name: "Docker"

on:
  workflow_dispatch:

  push:
    branches: ["master"]

  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: "Test"
    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Build images"
        run: "make build"

      - name: "Test images"
        run: "make test"

  build:
    name: "Build"
    runs-on: "ubuntu-latest"
    needs: ["test"]

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Build web image"
        uses: docker/build-push-action@v6
        with:
          context: "."
          file: "web/Dockerfile"
          push: false
          tags: "drupalista/web:latest"

      - name: "Build Redis image"
        uses: docker/build-push-action@v6
        with:
          context: "."
          file: "redis/Dockerfile"
          push: false
          tags: "drupalista/redis:latest"
